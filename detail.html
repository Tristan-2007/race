<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>竞赛详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{background:#f7fbff;padding:20px}
.wrap{max-width:720px;margin:auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 2px 10px #00000015}
.back{margin-bottom:16px;color:#258;text-decoration:none;font-size:14px}
.tag{display:inline-block;background:#cceeff;color:#117;padding:4px 8px;border-radius:6px;font-size:13px;margin-bottom:10px}
.title{font-size:28px;color:#222;font-weight:bold;margin-bottom:10px}
.meta{color:#778;font-size:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #eee}
.cover{text-align:center;margin-bottom:18px}
.cover img{max-width:100%;max-height:400px;border-radius:10px}
.content{font-size:16px;color:#333;line-height:1.9;white-space:pre-line}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back">← 返回列表</a>
  <div id="box"></div>
</div>

<script>
function getQuery(name){
  const params = new URLSearchParams(location.search);
  return params.get(name);
}

async function loadData(){
  try{
    const res = await fetch('./data.json');
    return await res.json();
  }catch{
    return { list: [] };
  }
}

(async () => {
  const targetId = getQuery('id');
  const data = await loadData();
  const item = (data.list || []).find(x => x.id === targetId);
  const box = document.getElementById('box');
  if(!item){
    box.innerHTML = `<div style="text-align:center;padding:40px;color:#99a">找不到这条竞赛信息</div>`;
    return;
  }
  let coverHtml = '';
  if(item.cover){
    coverHtml = `<div class="cover"><img src="${item.cover}" alt=""></div>`;
  }
  box.innerHTML = `
    <span class="tag">${item.tag || '其他'}</span>
    <div class="title">${item.title}</div>
    <div class="meta">发布：${item.publishAt || '未知'}｜截止：${item.deadline || '未公布'}</div>
    ${coverHtml}
    <div class="content">${item.content}</div>
  `;
})()
</script>
</body>
</html>
